services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-flyrank}
      POSTGRES_USER: ${DATABASE_USER:-flyrank}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-flyrank} -d ${DATABASE_NAME:-flyrank}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: